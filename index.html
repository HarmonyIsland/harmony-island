<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmony Island | Songs, Stories, Learning & Adventure</title>
<meta name="description" content="Welcome to Harmony Island with Heaven. Explore songs, stories, music, learning and adventures for curious families.">
<meta name="theme-color" content="#12233c">
<style>
:root {
  --navy:#12233c;
  --navy2:#1a3150;
  --gold:#e7be62;
  --gold2:#f6d98a;
  --sky:#74c9e8;
  --teal:#2aa7a4;
  --cream:#fffaf0;
  --ink:#17304d;
  --shadow:0 18px 50px rgba(15,35,58,.16);
  --radius:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:min(1160px,92%);margin:auto}
header{position:sticky;top:0;z-index:1000;background:rgba(18,35,60,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,190,98,.3)}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.8rem;color:white;font-weight:850;font-size:1.1rem}
.brand img{width:48px;height:48px;object-fit:contain;background:white;border-radius:50%;padding:3px;border:2px solid var(--gold)}
.nav-links{display:flex;align-items:center;gap:1.3rem}
.nav-links a{color:white;font-weight:650}
.nav-links a:hover{color:var(--gold2)}
.menu{display:none;border:0;background:none;color:white;font-size:1.8rem;cursor:pointer}
.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#8dd5ed 0%,#d2edf0 52%,#f6e7c8 100%)}
.hero:before{content:"";position:absolute;inset:auto 0 0;height:24%;background:linear-gradient(180deg,transparent,#2ca6b1);z-index:-1}
.sun{position:absolute;width:115px;height:115px;right:9%;top:9%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8ca,#f7d77b 55%,#e9b849);box-shadow:0 0 65px #ffe18199}
.cloud{position:absolute;width:120px;height:30px;background:#ffffffc9;border-radius:999px;top:18%;left:7%}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:50px;height:50px;left:12px;top:-20px}
.cloud:after{width:62px;height:62px;right:15px;top:-30px}
.c2{left:auto;right:22%;top:30%;transform:scale(.75)}
.c3{left:45%;top:12%;transform:scale(.55)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:2rem;align-items:center;position:relative;z-index:2;padding:6rem 0 8rem}
.eyebrow{display:inline-block;padding:.55rem .9rem;border-radius:999px;background:var(--navy);color:var(--gold2);font-weight:800;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1rem}
h1{font-size:clamp(2.8rem,6vw,5.7rem);line-height:1;color:var(--navy);letter-spacing:-.04em}
.hero p{font-size:1.2rem;max-width:650px;margin:1.3rem 0 1.7rem;color:#23445f}
.actions{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.9rem 1.15rem;border-radius:15px;font-weight:800;box-shadow:0 10px 25px #12233c1f;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--navy);color:white}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-light{background:white;color:var(--navy)}
.hero-art{position:relative;min-height:510px;display:flex;align-items:flex-end;justify-content:center}
.island{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:min(560px,95%);height:165px;border-radius:50% 50% 35% 35%;background:linear-gradient(#89c96a,#4d9d52);box-shadow:0 25px 0 #18615d33,0 40px 60px #104a5747}
.palm{position:absolute;bottom:27%;width:130px;height:230px}
.palm.left{left:4%}
.palm.right{right:4%;transform:scaleX(-1)}
.trunk{position:absolute;left:53%;bottom:0;width:20px;height:180px;background:linear-gradient(90deg,#9a6733,#d09a5a,#8a572a);border-radius:20px;transform:rotate(-6deg)}
.fronds{position:absolute;left:52%;top:-3px;width:100px;height:70px}
.fronds i{position:absolute;left:42px;top:30px;width:75px;height:18px;border-radius:100% 10%;background:#4a9c49;transform-origin:left center}
.fronds i:nth-child(1){transform:rotate(-34deg)}
.fronds i:nth-child(2){transform:rotate(-8deg)}
.fronds i:nth-child(3){transform:rotate(20deg)}
.fronds i:nth-child(4){transform:rotate(48deg)}
.heaven{position:relative;z-index:3;width:min(390px,72vw);filter:drop-shadow(0 24px 25px #12233c30);animation:float 4.5s ease-in-out infinite}
.heaven img{width:100%;height:auto;object-fit:contain}
.heaven-fallback{display:none;width:100%;aspect-ratio:3/4;border-radius:30px;background:linear-gradient(#fff7ec,#f7d4b5);align-items:center;justify-content:center;text-align:center;padding:2rem;font-weight:800}
.sparkle{position:absolute;color:#fff7c9;font-size:1.5rem;animation:twinkle 2.5s ease-in-out infinite}
.s1{top:14%;left:48%}.s2{top:30%;right:8%}.s3{top:45%;left:12%}.s4{bottom:24%;right:25%}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes twinkle{50%{transform:scale(1.4);opacity:.55}}
.wave{height:35px;background:var(--cream);border-radius:50% 50% 0 0;margin-top:-10px;position:relative}
section{padding:5.5rem 0}
.section-head{display:flex;justify-content:space-between;gap:1.5rem;align-items:end;margin-bottom:2rem}
.kicker{color:#2a8d90;font-weight:850;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
.section-head h2,.about h2{font-size:clamp(2rem,4vw,3.3rem);color:var(--navy);line-height:1.1}
.section-head p{max-width:560px;color:#5b7084}
.playlists{background:linear-gradient(#fffdf7,#f6efd9)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.card{background:white;border:1px solid #eadfca;border-radius:22px;padding:1.35rem;box-shadow:0 10px 30px #12233c0b;display:flex;flex-direction:column;justify-content:space-between;gap:1.1rem;min-height:210px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.icon{font-size:2rem;margin-bottom:.65rem}
.card h3,.channel-card h3{color:var(--navy);font-size:1.12rem;line-height:1.3;margin-bottom:.4rem}
.card p,.channel-card p{color:#5b7084;font-size:.94rem}
.card>a{color:#147f85;font-weight:850;margin-top:auto}
.card>a:hover{text-decoration:underline}
.about{background:#fff}
.about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:4rem;align-items:center}
.portrait{background:linear-gradient(150deg,#d9f1f3,#f7e4bd);border-radius:32px;padding:1.5rem;min-height:300px;display:flex;align-items:center;justify-content:center}
.portrait img{max-height:460px;object-fit:contain}
.about-copy p{margin:1rem 0;color:#536
